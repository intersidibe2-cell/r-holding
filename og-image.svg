<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1713"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d48a"/>
      <stop offset="30%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#c48b3f"/>
      <stop offset="70%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#a06a2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>
  <rect x="0" y="626" width="1200" height="4" fill="url(#gold)"/>
  <!-- R letter -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-weight="900" font-size="240" fill="url(#gold)">R</text>
  <!-- HOLDING text -->
  <text x="600" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="48" fill="#f2ede4" letter-spacing="16">HOLDING</text>
  <!-- Decorative line -->
  <line x1="420" y1="425" x2="780" y2="425" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <!-- URL -->
  <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="20" fill="#b3ab9d" letter-spacing="4">r-holding.ml</text>
</svg>