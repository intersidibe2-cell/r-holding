<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d48a"/>
      <stop offset="30%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#c48b3f"/>
      <stop offset="70%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#a06a2a"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d48a"/>
      <stop offset="50%" stop-color="#c48b3f"/>
      <stop offset="100%" stop-color="#a06a2a"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="60" fill="#0a0a0a" stroke="url(#goldBorder)" stroke-width="8"/>
  <!-- Inner subtle border -->
  <rect x="28" y="28" width="456" height="456" rx="50" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <!-- R letter -->
  <text x="256" y="300" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-weight="900" font-size="280" fill="url(#gold)">R</text>
  <!-- HOLDING text -->
  <text x="256" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="52" fill="#f2ede4" letter-spacing="12">HOLDING</text>
  <!-- Decorative line -->
  <line x1="130" y1="415" x2="382" y2="415" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <!-- URL -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="#b3ab9d" letter-spacing="2">r-holding.ml</text>
</svg>